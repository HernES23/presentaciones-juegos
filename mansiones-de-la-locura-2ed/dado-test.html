<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test dado octaedro 3D</title>
<style>
  body {
    margin: 0;
    background: #0d0e14;
    color: #d4b483;
    font-family: Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 40px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .zona-dados {
    display: flex;
    gap: 50px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  .dado-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .dado-wrapper canvas {
    display: block;
    width: 220px;
    height: 220px;
  }
  .etiqueta {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4b483;
    min-height: 18px;
  }
  .controles {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 22px;
    background: linear-gradient(135deg, #b58f5a, #d4b483);
    color: #1a1420;
    border: none;
    border-radius: 10px;
    font-family: Georgia, serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(181,143,90,0.4); }
  button:disabled { opacity: .3; cursor: not-allowed; }
  .info {
    font-size: 13px;
    color: #888;
    text-align: center;
    max-width: 520px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<h1>Test Octaedro 3D</h1>

<div class="zona-dados">
  <div class="dado-wrapper">
    <canvas id="dado1"></canvas>
    <div class="etiqueta" id="etiqueta1">—</div>
  </div>
  <div class="dado-wrapper">
    <canvas id="dado2"></canvas>
    <div class="etiqueta" id="etiqueta2">—</div>
  </div>
  <div class="dado-wrapper">
    <canvas id="dado3"></canvas>
    <div class="etiqueta" id="etiqueta3">—</div>
  </div>
</div>

<div class="controles">
  <button id="btnTirar">🎲 Tirar los dados</button>
  <button id="btnGirar">🔄 Girar continuo</button>
  <button id="btnParar">⏸ Detener</button>
</div>

<div class="info">
  Three.js carga las imágenes <code>img/dado-arcano.png</code>, <code>img/dado-lupa.png</code> y <code>img/dado-vacio.png</code> como texturas.
  Si no existen, se usan colores de respaldo.
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

// Imágenes de cada tipo de cara (se cargan o quedan null)
const texturas = {
  arcano: null,
  lupa:   null,
  vacio:  null,
};

// Colores de respaldo si no hay imagen
const colorRespaldo = {
  arcano: 0xc41e1e,
  lupa:   0xc41e1e,
  vacio:  0xc41e1e,
};

// Cargar texturas
const loader = new THREE.TextureLoader();
const rutas = {
  arcano: 'img/dado-arcano.png',
  lupa:   'img/dado-lupa.png',
  vacio:  'img/dado-vacio.png',
};
for (const [tipo, url] of Object.entries(rutas)) {
  loader.load(url,
    (tex) => { texturas[tipo] = tex; },
    undefined,
    () => { /* si falla, queda null */ }
  );
}

/* ============================================================
   CREAR UN DADO (OCTAEDRO)
   ============================================================ */

function crearDado(canvasId) {
  const canvas = document.getElementById(canvasId);

  // Renderer
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: true,
  });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(220, 220, false);
  renderer.setClearColor(0x000000, 0);

  // Escena
  const escena = new THREE.Scene();

  // Cámara
  const camara = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camara.position.set(0, 0, 4);
  camara.lookAt(0, 0, 0);

  // Luces
  const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.7);
  escena.add(luzAmbiente);

  const luzDir = new THREE.DirectionalLight(0xffffff, 1.2);
  luzDir.position.set(2, 3, 4);
  escena.add(luzDir);

  const luzDir2 = new THREE.DirectionalLight(0xb58f5a, 0.6);
  luzDir2.position.set(-2, -1, -2);
  escena.add(luzDir2);

  // Geometría: octaedro
  const geo = new THREE.OctahedronGeometry(1.2, 0);

  // Materiales: 8 caras (Three.js usa grupos para OctahedronGeometry)
  // En Three.js, OctahedronGeometry tiene 8 grupos, uno por cara
  // Creamos 8 materiales, cada uno con su textura o color

  // Distribución de tipos por cara (para que se vea variado)
  const tiposPorCara = ['arcano', 'lupa', 'vacio', 'arcano', 'vacio', 'arcano', 'lupa', 'vacio'];

  const materiales = tiposPorCara.map(tipo => {
    return new THREE.MeshStandardMaterial({
      color: texturas[tipo] ? 0xffffff : colorRespaldo[tipo],
      map: texturas[tipo] || null,
      metalness: 0.3,
      roughness: 0.5,
      side: THREE.DoubleSide,
    });
  });

  const dado = new THREE.Mesh(geo, materiales);
  escena.add(dado);

  // Añadir bordes dorados
  const edges = new THREE.EdgesGeometry(geo);
  const lineas = new THREE.LineSegments(
    edges,
    new THREE.LineBasicMaterial({ color: 0xd4b483, linewidth: 2 })
  );
  dado.add(lineas);

  return { renderer, escena, camara, dado, canvas };
}

/* ============================================================
   INSTANCIAR LOS 3 DADOS
   ============================================================ */

const dado1 = crearDado('dado1');
const dado2 = crearDado('dado2');
const dado3 = crearDado('dado3');

// Rotación inicial distinta para cada uno
dado1.dado.rotation.set(0.5, 0.7, 0.3);
dado2.dado.rotation.set(0.3, 1.2, 0.5);
dado3.dado.rotation.set(0.7, 0.4, 0.2);

/* ============================================================
   RENDER LOOP
   ============================================================ */

function render() {
  dado1.renderer.render(dado1.escena, dado1.camara);
  dado2.renderer.render(dado2.escena, dado2.camara);
  dado3.renderer.render(dado3.escena, dado3.camara);
}
render();

/* ============================================================
   ANIMACIONES
   ============================================================ */

// Rotación continua suave (para que se vea que es 3D)
let girandoContinuo = false;
let animFrameId = null;

function loopContinuo() {
  if (!girandoContinuo) return;
  dado1.dado.rotation.y += 0.01;
  dado2.dado.rotation.y += 0.015;
  dado3.dado.rotation.y += 0.02;
  render();
  animFrameId = requestAnimationFrame(loopContinuo);
}

// Tirada: gira rápido y se detiene en ángulo aleatorio
function animarTirada(dadoObj, duracion = 1500) {
  return new Promise(resolve => {
    const inicio = performance.now();
    const rotIni = {
      x: dadoObj.dado.rotation.x,
      y: dadoObj.dado.rotation.y,
      z: dadoObj.dado.rotation.z,
    };
    // Vueltas completas + un offset aleatorio
    const vueltasX = 3 + Math.floor(Math.random() * 3);
    const vueltasY = 3 + Math.floor(Math.random() * 3);
    const vueltasZ = 2 + Math.floor(Math.random() * 2);
    const offX = Math.random() * Math.PI * 2;
    const offY = Math.random() * Math.PI * 2;
    const offZ = Math.random() * Math.PI * 2;

    function frame(ahora) {
      const t = Math.min((ahora - inicio) / duracion, 1);
      const ease = 1 - Math.pow(1 - t, 3);

      dadoObj.dado.rotation.x = rotIni.x + (Math.PI * 2 * vueltasX + offX) * ease;
      dadoObj.dado.rotation.y = rotIni.y + (Math.PI * 2 * vueltasY + offY) * ease;
      dadoObj.dado.rotation.z = rotIni.z + (Math.PI * 2 * vueltasZ + offZ) * ease;

      render();

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

/* ============================================================
   CONTROLES
   ============================================================ */

document.getElementById('btnTirar').addEventListener('click', async () => {
  girandoContinuo = false;
  if (animFrameId) cancelAnimationFrame(animFrameId);
  document.getElementById('etiqueta1').textContent = '—';
  document.getElementById('etiqueta2').textContent = '—';
  document.getElementById('etiqueta3').textContent = '—';

  await Promise.all([
    animarTirada(dado1, 1500),
    animarTirada(dado2, 2000),
    animarTirada(dado3, 2500),
  ]);

  document.getElementById('etiqueta1').textContent = 'Resultado 1';
  document.getElementById('etiqueta2').textContent = 'Resultado 2';
  document.getElementById('etiqueta3').textContent = 'Resultado 3';
});

document.getElementById('btnGirar').addEventListener('click', () => {
  girandoContinuo = true;
  loopContinuo();
});

document.getElementById('btnParar').addEventListener('click', () => {
  girandoContinuo = false;
  if (animFrameId) cancelAnimationFrame(animFrameId);
});

</script>

</body>
</html>
